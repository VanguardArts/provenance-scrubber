name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            gui_name: image-scrub
          - os: windows-latest
            platform: windows
            gui_name: image-scrub.exe
          - os: macos-latest
            platform: macos
            gui_name: image-scrub

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build CLI binary
        run: |
          pyinstaller --onefile --name image-scrub-cli cli_main.py

      - name: Build GUI app
        run: |
          pyinstaller --onefile --windowed --name image-scrub desktop_gui.py

      - name: Package artifacts (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar czf ../image-scrub-cli-${{ matrix.platform }}.tar.gz image-scrub-cli
          if [ "${{ matrix.platform }}" = "macos" ]; then
            ditto -c -k --sequesterRsrc image-scrub.app ../image-scrub-gui-${{ matrix.platform }}.zip
          else
            tar czf ../image-scrub-gui-${{ matrix.platform }}.tar.gz ${{ matrix.gui_name }}
          fi

      - name: Package artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive dist/image-scrub-cli.exe image-scrub-cli-windows.zip
          Compress-Archive dist/image-scrub.exe image-scrub-gui-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: image-scrub-${{ matrix.platform }}
          path: |
            image-scrub-cli-${{ matrix.platform }}.*
            image-scrub-gui-${{ matrix.platform }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate icon assets
        run: python3 -m pip install --quiet cairosvg && python3 scripts/make_icons.py

      - name: Build .deb (Debian/Ubuntu)
        run: bash scripts/build-deb.sh

      - name: Build .rpm (Fedora/RHEL/openSUSE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          bash scripts/build-rpm.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: image-scrub-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            image-scrub-cli-*
            image-scrub-gui-*
            build/deb/*.deb
            build/rpm/RPMS/noarch/*.rpm
          generate_release_notes: true
