app-id: com.vanguardarts.ImageScrub
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: image-scrub-gui
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --prefix=${FLATPAK_DEST} Pillow flask requests
  - name: image-scrub
    buildsystem: simple
    build-commands:
      - install -dm755 ${FLATPAK_DEST}/lib/image-scrub
      - cp -r image_scrub ${FLATPAK_DEST}/lib/image-scrub/
      - cp cli_main.py desktop_gui.py webapp.py ${FLATPAK_DEST}/lib/image-scrub/
      - install -Dm755 ${FLATPAK_DEST}/lib/image-scrub/cli_main.py ${FLATPAK_DEST}/bin/image-scrub
      - install -Dm755 ${FLATPAK_DEST}/lib/image-scrub/desktop_gui.py ${FLATPAK_DEST}/bin/image-scrub-gui
      - install -Dm644 packaging/image-scrub.desktop ${FLATPAK_DEST}/share/applications/com.vanguardarts.ImageScrub.desktop
      - install -Dm644 packaging/image-scrub.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/com.vanguardarts.ImageScrub.svg
      - install -Dm644 packaging/flatpak/com.vanguardarts.ImageScrub.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.vanguardarts.ImageScrub.metainfo.xml
    sources:
      - type: dir
        path: .
